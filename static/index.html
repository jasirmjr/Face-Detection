<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event Face Finder</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen">
  <div class="max-w-5xl mx-auto py-10 px-4">
    <header class="text-center mb-8">
      <h1 class="text-3xl font-bold tracking-tight text-gray-900">Event Photo Finder</h1>
      <p class="text-gray-500 mt-2">Upload a single selfie to find all photos containing your face</p>
    </header>

    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 max-w-lg mx-auto">
      <div class="mb-4">
        <div class="flex items-center justify-between mb-1">
          <label class="block text-sm font-medium text-gray-700">Event Identifier</label>
          <button type="button" id="indexBtn" onclick="indexEventPhotos()" class="text-xs text-blue-600 hover:text-blue-800 font-medium cursor-pointer transition-colors" title="Click whenever you add or remove photos from the folder">
            ↻ Re-index Folder Photos
          </button>
        </div>
        <input type="text" id="eventId" value="annual-meet" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="e.g. annual-meet" />
      </div>

      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">Your Selfie / Reference Photo</label>
        <input type="file" id="selfieInput" accept="image/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100" />
      </div>

      <div class="mb-5">
        <div class="flex justify-between items-center mb-1">
          <label class="text-sm font-medium text-gray-700">Match Strictness (Threshold)</label>
          <span id="thresholdVal" class="text-xs font-semibold text-blue-600 bg-blue-50 px-2 py-0.5 rounded">0.45</span>
        </div>
        <input type="range" id="thresholdSlider" min="0.30" max="0.65" step="0.05" value="0.45" oninput="document.getElementById('thresholdVal').innerText = this.value" class="w-full h-1.5 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-blue-600" />
        <p class="text-xs text-gray-400 mt-1">0.45 is recommended. Higher values avoid strangers; lower values catch distant faces.</p>
      </div>

      <button id="searchBtn" onclick="findPhotos()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition-colors">
        Find My Photos
      </button>

      <div id="loader" class="hidden text-center mt-4 text-blue-600 font-medium">
        Scanning faces, please wait...
      </div>
    </div>

    <!-- Gallery Results -->
    <div class="mt-12">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-semibold text-gray-900" id="resultCount">Photos Found: 0</h2>
      </div>
      <div id="gallery" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4"></div>
    </div>
  </div>

  <script>
    async function findPhotos() {
      const eventId = document.getElementById("eventId").value.trim();
      const fileInput = document.getElementById("selfieInput");
      const loader = document.getElementById("loader");
      const gallery = document.getElementById("gallery");
      const resultCount = document.getElementById("resultCount");

      if (!eventId || !fileInput.files[0]) {
        alert("Please provide both Event ID and a selfie image.");
        return;
      }

      loader.classList.remove("hidden");
      gallery.innerHTML = "";

      const formData = new FormData();
      formData.append("selfie", fileInput.files[0]);
      const threshold = document.getElementById("thresholdSlider") ? document.getElementById("thresholdSlider").value : "0.45";
      formData.append("threshold", threshold);

      try {
        const res = await fetch(`/api/events/${eventId}/search`, {
          method: "POST",
          body: formData,
        });
        const data = await res.json();
        loader.classList.add("hidden");

        if (data.results && data.results.length > 0) {
          resultCount.innerText = `Photos Found: ${data.results.length}`;
          data.results.forEach(item => {
            const card = document.createElement("div");
            card.className = "group relative rounded-lg overflow-hidden border bg-white shadow-sm";
            card.innerHTML = `
              <img src="${item.url}" alt="${item.file_name}" class="w-full h-48 object-cover" />
              <div class="p-2 flex justify-between items-center text-xs">
                <span class="text-gray-500">Score: ${item.similarity_score}</span>
                <a href="${item.url}" download target="_blank" class="text-blue-600 font-medium hover:underline">Download</a>
              </div>
            `;
            gallery.appendChild(card);
          });
        } else {
          resultCount.innerText = "Photos Found: 0";
          gallery.innerHTML = `<p class="col-span-full text-center text-gray-500">No matching photos found for this event.</p>`;
        }
      } catch (err) {
        loader.classList.add("hidden");
        alert("Failed to process the request. Check server console.");
      }
    }

    async function indexEventPhotos() {
      const eventId = document.getElementById("eventId").value.trim();
      if (!eventId) {
        alert("Please enter an Event Identifier.");
        return;
      }

      const indexBtn = document.getElementById("indexBtn");
      indexBtn.innerText = "⏳ Indexing...";
      indexBtn.disabled = true;

      try {
        const res = await fetch(`/api/events/${eventId}/index`, { method: "POST" });
        const data = await res.json();
        if (res.ok) {
          alert(`Successfully indexed '${eventId}'!\nProcessed: ${data.images_processed} images\nFaces Indexed: ${data.faces_indexed}`);
        } else {
          alert(`Indexing failed: ${data.detail || "Unknown error"}`);
        }
      } catch (err) {
        alert("Network or server error while indexing.");
      } finally {
        indexBtn.innerText = "↻ Re-index Folder Photos";
        indexBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
